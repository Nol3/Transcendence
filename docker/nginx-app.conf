server {
    listen 4200;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Default nginx limit is 1M; avatar uploads (1-2MB photos) were hitting 413
    # before even reaching Django.
    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Content-Security-Policy: el HTML de la app lo sirve **este** nginx, así que aquí es donde
    # el navegador aplica la política. Tenerla solo en Django dejaba la página sin ella (Django
    # protege sus respuestas de la API, que son JSON y no renderizan nada).
    # Ojo: los `location` que declaran sus propios `add_header` **anulan** los de este bloque
    # (es una trampa clásica de nginx), así que si añades uno, repite esta línea.
    # La política está alineada con `CONTENT_SECURITY_POLICY` de `config/settings.py`: si
    # cambias una, cambia la otra — hay un test que compara las dos listas de directivas.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' https://accounts.google.com; worker-src 'self'; manifest-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    # GSI (Google Sign-In) cannot postMessage across COOP boundaries.
    # Hide any upstream COOP/COEP so the Google Sign-In flow works.
    # The game iframe's COOP is set by the backend, not by this server block.
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Embedder-Policy;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    # REST API → Django backend. Without this, a POST to /api/* falls through to
    # the SPA fallback below (try_files → index.html) and nginx returns 405 on a
    # static file. ^~ wins over the regex asset-cache rule.
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        # $http_host preserves the port from the client's Host header; $host
        # strips it, which made Django build absolute URLs (e.g. avatar URLs)
        # without the port, so the browser fell back to the default port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # WebSockets (Channels/Daphne) → backend, with the Upgrade handshake.
    location ^~ /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_redirect off;
    }

    # User-uploaded media (avatars, etc). Missing before — /media/* requests
    # fell through to the Angular SPA fallback (or the wrong port entirely,
    # see the Host header fix above), which is why avatar images failed to load.
    # Los avatares se sirven **desde aquí**, no proxeados al backend: con `DEBUG=false` Django
    # no sirve ficheros, y con el proxy además la petición acababa en un 301 a https sobre una
    # URL que ya era https (el TLS lo termina el nginx del borde, así que aquí `$scheme` es
    # http). El directorio llega por volumen: `backend/media` en desarrollo y el volumen
    # `media_data` en producción (el mismo que guarda el backend y entra en las copias).
    location ^~ /media/ {
        alias /srv/media/;
        access_log off;
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ^~ /media-proxy-desactivado/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location ^~ /static/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Angular routing: serve index.html for all non-file requests
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WASM card game — proxy to Django backend so it is served SAME-ORIGIN as
    # the Angular app. Avoids cross-origin CORS/COEP on index.wasm/.data and
    # lets the backend's COOP/COEP/CORP headers pass through untouched.
    # ^~ stops the regex asset-cache rule below from capturing /game-embed/*.js|.wasm.
    location ^~ /game-embed/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # Framing is governed by the backend's CSP frame-ancestors. Drop the
        # redundant X-Frame-Options (browser logs "ignoring x-frame-options"
        # otherwise). Declaring add_header here also detaches the server-level
        # headers for this location, so re-add nosniff explicitly. The backend's
        # COOP/COEP/CORP/CSP are upstream headers and pass through untouched.
        proxy_hide_header X-Frame-Options;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Raw game assets (cards, table, audio) referenced from HTML/CSS.
    location ^~ /game-assets/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Cache static assets
    # PWA (roadmap 7.4). Dos cosas que hay que hacer bien o la app se queda clavada:
    #  1) el service worker y su manifiesto de caché NO se cachean a largo plazo: si el
    #     navegador se guarda un ngsw-worker.js viejo, la app nunca se actualiza;
    #  2) el manifiesto necesita su tipo MIME (el mime.types de nginx no trae
    #     .webmanifest y lo servía como octet-stream).
    location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 1h;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
    }
}
