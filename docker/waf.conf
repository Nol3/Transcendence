# --- Rate limiting zones ---
# Keyed by client IP. ~10 req/s sustained; the per-location limit_req sets the
# burst. This file is included inside the image's http{} block, so http-level
# directives like limit_req_zone are valid here.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/s;

# ── IP real detrás de Cloudflare ────────────────────────────────────────────────────────────
# `$remote_addr` es la IP de quien conecta. Con Cloudflare delante, eso es **siempre una IP del
# borde**: sin lo de abajo, todos los visitantes comparten un único cubo del limitador
# (10 r/s y 1000/hora por IP) y con cuatro personas se cae el sitio para todos.
#
# `CF-Connecting-IP` trae la IP del cliente y `set_real_ip_from` hace que **solo** se acepte si
# la conexión viene de un rango de Cloudflare; si no, cualquiera podría inventarse la cabecera.
# Lista oficial (se actualiza de vez en cuando): https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Cloudflare manda `CF-Visitor: {"scheme":"https"}`. Se usa para reconstruir el esquema real:
# por túnel el origen recibe HTTP aunque el usuario vaya por HTTPS, y sin esto Django redirigiría
# en bucle (`SECURE_SSL_REDIRECT`). Sin Cloudflare delante, `$esquema_real` es `$scheme`.
map $http_cf_visitor $esquema_cf {
    default               "";
    "~*\"scheme\":\"https\""  "https";
}
map $esquema_cf $esquema_real {
    "https"  "https";
    default  $scheme;
}

server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Base image default is 1M; avatar uploads need headroom.
    client_max_body_size 20M;

    # --- API ---
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        # Django ya manda X-Frame-Options; este bloque la vuelve a añadir (SAMEORIGIN).
        # Se oculta la de arriba para no enviarla dos veces.
        proxy_hide_header X-Frame-Options;

        # Security headers (always = also applied to proxied 4xx/5xx).
        # HSTS: force HTTPS for a year (incl. subdomains).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # SAMEORIGIN: block third-party framing but still allow the game iframe,
        # which is embedded from the same origin.
        add_header X-Frame-Options "SAMEORIGIN" always;
        # Stop browsers MIME-sniffing API responses.
        add_header X-Content-Type-Options "nosniff" always;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_real;
        proxy_redirect off;
    }

    # --- WebSockets (Daphne/ASGI) ---
    # Live tournament brackets, matchmaking and game rooms connect here.
    # The Upgrade/Connection headers are required for the HTTP→WS handshake.
    location /ws/ {
        limit_req zone=ws_limit burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_real;
        proxy_read_timeout 86400;
        proxy_redirect off;
    }

    # --- Admin ---
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_real;
    }

    # --- Game (WASM iframe served by the backend at /game-embed/) ---
    location /game-embed/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_real;
        proxy_redirect off;
    }

    location /game-assets/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_real;
        proxy_redirect off;
    }

    # --- Static ---
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_cache_valid 200 10d;
    }

    # Los avatares los sirve el nginx del front desde el volumen compartido, **no** el backend:
    # con `DEBUG=false` Django no sirve ficheros, y por el proxy la petición acababa en un 301 a
    # `https://backend:8000/...`, un host interno que el navegador no puede resolver.
    location /media/ {
        proxy_pass http://frontend:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_real;
    }

    # --- Frontend fallback ---
    location / {
        # Clear COOP/COEP from the OWASP CRS image defaults — the GSI button
        # (Google Sign-In) cannot postMessage across COOP boundaries.
        more_clear_headers "Cross-Origin-Opener-Policy";
        more_clear_headers "Cross-Origin-Embedder-Policy";

        proxy_pass http://frontend:4200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        # El front no usa el esquema, pero un `X-Forwarded-Proto` coherente evita sorpresas si
        # mañana alguna ruta pasa por aquí.
        proxy_set_header X-Forwarded-Proto $esquema_real;
        proxy_cache_bypass $http_upgrade;
    }
}