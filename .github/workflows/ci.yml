name: CI

# Se ejecuta en cada push a main y en cada Pull Request: es el mismo conjunto de
# comprobaciones que se corren a mano antes de integrar.
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        # `tblib` deja que el runner paralelo serialice la excepción real; sin él, cualquier
        # fallo sale como «cannot pickle 'traceback'» y no hay forma de saber qué pasó.
        run: pip install -r requirements.txt tblib

      - name: Catálogos de traducción
        # `msgfmt` (paquete gettext) compila los .po de locale/; sin esto los tests
        # de i18n de la API verían los mensajes sin traducir.
        run: |
          sudo apt-get update && sudo apt-get install -y gettext
          python manage.py compilemessages

      - name: Comprobaciones de Django
        run: python manage.py check

      - name: Migraciones al día
        # Un modelo cambiado sin su migración pasa los tests (Django la crea al vuelo) y
        # revienta al desplegar. Aquí se corta.
        run: python manage.py makemigrations --check --dry-run

      - name: Dependencias vulnerables
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Linter (ruff)
        run: |
          pip install ruff
          ruff check .

      - name: Tests con cobertura
        # Sin Vault ni .env: los valores por defecto del settings bastan para
        # los tests (sqlite, DEBUG=True, clave de desarrollo).
        env:
          USE_VAULT: 'false'
          DJANGO_DEBUG: 'true'
        run: |
          pip install coverage
          coverage run --source=apps --omit="*/migrations/*,*/tests/*,*/__init__.py" manage.py test
          coverage report --fail-under=70

  backend-postgres:
    name: Backend (Django · PostgreSQL)
    # Producción va sobre PostgreSQL (`compose.prod.yaml` fuerza ese motor) y la suite de arriba
    # corre sobre SQLite. Este job prueba lo mismo contra el motor de verdad: transacciones,
    # `select_for_update`, búsquedas insensibles a mayúsculas y `CONN_MAX_AGE` no se comportan
    # igual en los dos.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: transcendence
          POSTGRES_PASSWORD: transcendence
          POSTGRES_DB: transcendence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transcendence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      USE_VAULT: 'false'
      DJANGO_DEBUG: 'true'
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: transcendence
      DB_USER: transcendence
      DB_PASSWORD: transcendence
      DB_HOST: localhost
      DB_PORT: '5432'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        # `tblib` deja que el runner paralelo serialice la excepción real; sin él, cualquier
        # fallo sale como «cannot pickle 'traceback'» y no hay forma de saber qué pasó.
        run: pip install -r requirements.txt tblib

      - name: Catálogos de traducción
        run: |
          sudo apt-get update && sudo apt-get install -y gettext
          python manage.py compilemessages

      - name: Tests
        run: python manage.py test --parallel auto

  stack:
    name: Stack completo (docker compose · e2e multijugador)
    # El CI de arriba usa mocks de la API: los dos specs que hablan con el servidor de verdad
    # (`culo-online`, `juegos-online`) se saltan siempre. Este job construye las imágenes y juega
    # de verdad, con dos navegadores, contra nginx y el WebSocket.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: .env para CI
        # Secretos de mentira: este stack vive y muere en el runner.
        run: |
          cp .env.example .env
          sed -i 's|^DJANGO_DEBUG=.*|DJANGO_DEBUG=false|' .env
          sed -i 's|^DJANGO_SECRET_KEY=.*|DJANGO_SECRET_KEY=ci-secret-key-0123456789abcdef0123456789abcdef|' .env
          sed -i 's|^JWT_SECRET_KEY=.*|JWT_SECRET_KEY=ci-jwt-secret-0123456789abcdef0123456789abcdef|' .env

      - name: Construir y levantar
        run: docker compose up -d --build

      - name: Esperar a que el stack esté sano
        run: |
          for _ in $(seq 1 60); do
            sanos=$(docker compose ps --format '{{.Status}}' | grep -c healthy)
            if [ "$sanos" -ge 4 ]; then echo "stack sano ($sanos)"; exit 0; fi
            sleep 3
          done
          echo "El stack no arrancó a tiempo"; docker compose ps; docker compose logs --tail=80 backend nginx; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Instalar dependencias del front
        working-directory: front
        run: npm ci

      - name: Instalar Chromium
        working-directory: front
        run: npx playwright install --with-deps chromium

      - name: e2e contra el stack (multijugador)
        working-directory: front
        # El stack ya sirve la app en :4200 (con la API real): Playwright no debe arrancar otro.
        env:
          PLAYWRIGHT_REUSE_SERVER: 'true'
        run: npx playwright test e2e/culo-online.spec.ts e2e/juegos-online.spec.ts --project=chromium

      - name: Logs si algo falla
        if: failure()
        run: docker compose logs --tail=200

      - name: Guardar el informe de Playwright si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-stack
          path: front/playwright-report/
          retention-days: 7

  frontend:
    name: Frontend (Angular · build y e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Linter (ESLint)
        run: npm run lint

      - name: Traducciones (paridad y literales sueltos)
        run: npm run i18n:check

      - name: Dependencias vulnerables
        # Solo producción: las de desarrollo no viajan al navegador, pero se vigilan con
        # Dependabot (.github/dependabot.yml).
        run: npm audit --omit=dev --audit-level=high

      - name: Build de producción
        run: npm run build

      - name: Tests unitarios
        run: npm test -- --watch=false

      - name: Instalar navegadores de Playwright
        # Los tres motores estándar (módulo «Navegadores»): Blink, Gecko y WebKit.
        # Edge no se puede instalar aquí (usa el del sistema), así que su proyecto
        # se ejecuta en local, no en CI.
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Tests end-to-end
        # Los e2e usan mocks de la API, así que no hace falta backend.
        run: npx playwright test --project=chromium --project=firefox --project=webkit

      - name: Guardar el informe de Playwright si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: front/playwright-report/
          retention-days: 7
