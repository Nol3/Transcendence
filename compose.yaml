services:
  # ==========================================
  # Backend Service (Django + FastAPI)
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ft_transcendence_backend
    user: root
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # OJO: settings.py lee DJANGO_DEBUG (no DEBUG). Al pasar solo DEBUG, el
      # contenedor caía al fichero .env y podía arrancar con DEBUG=True.
      - DJANGO_DEBUG=${DJANGO_DEBUG:-false}
      - DEBUG=${DJANGO_DEBUG:-false}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DB_ENGINE=${DB_ENGINE}
      - DB_NAME=${DB_NAME}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      # Vault (dev mode). When USE_VAULT is on, settings.py pulls secrets from
      # secret/transcendence; otherwise it falls back to the env vars above.
      - USE_VAULT=${USE_VAULT:-true}
      - VAULT_ADDR=${VAULT_ADDR:-http://vault:8200}
      # Con Redis, el channel layer y la cola de emparejamiento se comparten entre
      # réplicas: `docker compose up -d --scale backend=2` ya empareja a dos
      # jugadores que caigan en procesos distintos.
      - REDIS_URL=redis://redis:6379/0
      - MATCH_QUEUE_BACKEND=redis
      # Limitador de peticiones: en desarrollo los e2e registran muchas cuentas y con el
      # límite de producción (60/hora por IP) se quedan fuera a mitad de suite. En el
      # despliegue no se pone y vale el valor de por defecto, que es el estricto.
      - THROTTLE_ANON=${THROTTLE_ANON:-1200/hour}
      # PostgreSQL (4.2). Para volver a SQLite basta con DB_ENGINE=sqlite3.
      - DB_ENGINE=${DB_ENGINE:-django.db.backends.postgresql}
      - DB_NAME=${DB_NAME:-transcendence}
      - DB_USER=${DB_USER:-transcendence}
      - DB_PASSWORD=${DB_PASSWORD:-transcendence}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=5432
    volumes:
      - ./backend:/app
      # Raylib/WASM poker game build (served by Django at /game/).
      # PROJECT_ROOT inside the container is "/", so juego maps to /juego.
      - ./juego:/juego:ro
      - vault_creds:/vault_creds:ro
    command: >
      sh -c "python manage.py compilemessages &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    networks:
      - transcendence-network
    depends_on:
      # Wait until vault-init has finished writing secrets to Vault so the first
      # settings load can read them (the loader still falls back gracefully).
      vault-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================
  # Frontend Service (Angular + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./front
      dockerfile: ../docker/Dockerfile.frontend
    container_name: ft_transcendence_frontend
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    environment:
      - NG_ENV=${NG_ENV:-production}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:8000}
    volumes:
      # Serve config mounted at runtime so the image build context (./front)
      # doesn't need to reach ../docker. Static prod build comes from the image.
      - ./docker/nginx-app.conf:/etc/nginx/conf.d/default.conf:ro
      # Los avatares: se sirven desde el propio nginx (ver `nginx-app.conf`). En desarrollo
      # son los ficheros del repositorio; en producción, el volumen compartido con el backend.
      - ./backend/media:/srv/media:ro
    networks:
      - transcendence-network
    depends_on:
      - backend
    healthcheck:
      # 127.0.0.1, not localhost (→ ::1): the image's nginx binds IPv4 only.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4200/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==========================================
  # Reverse Proxy (Nginx)
  # ==========================================
  # ==========================================
  # PostgreSQL (base de datos del despliegue, 4.2)
  # ==========================================
  postgres:
    # Imagen fijada a un digest (no a una etiqueta flotante): un `pull` no trae una versión
    # nueva sin avisar. Para actualizar: `docker pull postgres:16-alpine` y copia el digest
    # que salga de `docker image inspect --format '{{index .RepoDigests 0}}' postgres:16-alpine`.
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    container_name: ft_transcendence_postgres
    environment:
      - POSTGRES_DB=${DB_NAME:-transcendence}
      - POSTGRES_USER=${DB_USER:-transcendence}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-transcendence}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - transcendence-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-transcendence} -d ${DB_NAME:-transcendence}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis (channel layer + cola de emparejamiento)
  # ==========================================
  redis:
    # Fijada a digest, igual que Postgres (ver arriba).
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: ft_transcendence_redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - transcendence-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # SSL bootstrap — generates a self-signed cert into the ssl_certs volume so
  # NO private key is ever committed to git. Idempotent: skips if a cert already
  # exists. nginx waits for this to finish before starting (depends_on below).
  # ==========================================
  ssl-init:
    # Fijada a digest: `latest` era la peor de todas (cambiaba sola en cada `pull`).
    image: alpine/openssl@sha256:a31e47e338dac84c48788c23bb003be27ed325b7a2185d359f22e3ba4e78bcab
    container_name: ft_transcendence_ssl_init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /ssl/cert.pem ] || [ ! -f /ssl/key.pem ]; then
          openssl req -x509 -newkey rsa:4096 -nodes -days 365 \
            -keyout /ssl/key.pem -out /ssl/cert.pem \
            -subj "/C=ES/ST=Madrid/L=Madrid/O=42/CN=localhost" &&
          echo "[SSL-INIT] Self-signed certificate generated.";
        else
          echo "[SSL-INIT] Certificate already present, skipping.";
        fi
        chmod 644 /ssl/key.pem /ssl/cert.pem || true
    volumes:
      - ssl_certs:/ssl
    restart: "no"

  nginx:
    #image: nginx:alpine
    # El borde (WAF). Fijada a digest por lo mismo: es la pieza que más duele si cambia sola.
    image: owasp/modsecurity-crs:nginx@sha256:cdac1390ba577d82038933e5c30fd2e8c83bf81a8369db35f5e49837f90605b2
    container_name: ft_transcendence_nginx
    ports:
    # nginx inside the image listens on 8080/8443 (non-root, "avoid privileged
    # ports"), so the host side maps to those, never to 80/443 — no sudo needed.
    # Override HTTPS_PORT/HTTP_PORT if 8443/8080 are already taken on the host.
      - "${HTTPS_PORT:-8443}:8443"
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      # The OWASP modsecurity creates its own conf file and it cannot be copied from the outside;
      #instead, we leave the default conf as it is and then we OVERRIDE with custom configuration, not the other way around, thats why I create the waf.conf file
      #- ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/waf.conf:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./docker/modsecurity-override.conf:/etc/nginx/templates/modsecurity.d/modsecurity-override.conf.template:ro
      # Certs come from the ssl_certs volume populated by ssl-init at runtime,
      # never from a git-tracked ./docker/ssl bind mount.
      - ssl_certs:/etc/nginx/ssl:ro
    environment:
      - MODSEC_AUDIT_ENGINE=On
    networks:
      - transcendence-network
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
      ssl-init:
        condition: service_completed_successfully
    healthcheck:
      # Comprueba de verdad que nginx responde, no solo que la configuración
      # compila: `curl -k` porque el certificado es autofirmado y 127.0.0.1 (no
      # `localhost` → ::1) porque escucha en IPv4. Sirve en 8443 dentro del
      # contenedor; el 80 solo redirige.
      test: ["CMD", "curl", "-fsk", "-o", "/dev/null", "https://127.0.0.1:8443/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  vault:
    # Fijada a digest, igual que las demás.
    image: hashicorp/vault:1.15@sha256:0450896c43b13879b19442b204ce29dd19b5a10fce43d5cf38af17da20f56f4d
    container_name: ft_transcendence_vault
    ports:
      # Override VAULT_PORT if 8200 is already taken on the host.
      - "${VAULT_PORT:-8200}:8200"
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
    # apparently it is acceptable to present it in dev mode
    command:
      - vault
      - server
      - -dev
      - -dev-root-token-id=root
      - -dev-listen-address=0.0.0.0:8200
    cap_add:
    #IPC_LOCK prevents secrets from being swapped to disk (RAM → swap),
      - IPC_LOCK
    networks:
      - transcendence-network
    volumes:
      - vault_data:/vault/file

  vault-init:
    # Fijada a digest, igual que las demás.
    image: hashicorp/vault:1.15@sha256:0450896c43b13879b19442b204ce29dd19b5a10fce43d5cf38af17da20f56f4d
    container_name: ft_transcendence_vault_init
    depends_on:
      - vault
    networks:
      - transcendence-network
    volumes: 
      - ./scripts/vault-init.sh:/vault-init.sh:ro
      - vault_creds:/vault_creds
    entrypoint:
      - sh
      - /vault-init.sh
    restart: "no"

# ==========================================
# Networks
# ==========================================
networks:
  transcendence-network:
    driver: bridge

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
  redis_data:
  backend_data:
    driver: local
  frontend_data:
    driver: local
  vault_data:
  vault_creds:
  # Holds the runtime-generated self-signed TLS cert (see ssl-init service).
  ssl_certs:
