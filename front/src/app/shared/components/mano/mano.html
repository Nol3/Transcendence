<div
  class="mano"
  [class.mano--turno]="turno()"
  [style.--n]="cartas().length"
  [style.--dmax]="mitad()"
  [style.--carta-w.px]="anchoCarta()"
>
  @for (c of cartas(); track c.id) {
    <button
      type="button"
      class="mano__carta"
      [class.mano__carta--sel]="estaElegida(c.id)"
      [class.mano__carta--ilegal]="!!c.ilegal"
      [disabled]="deshabilitada() || !!c.deshabilitada"
      [style.--i]="$index"
      (click)="alPulsar(c.id)"
      (pointerdown)="alBajar($event, c)"
      (pointerup)="alSoltar($event, c)"
      (pointercancel)="alCancelar()"
      (pointerleave)="alCancelar()"
      [attr.aria-pressed]="estaElegida(c.id)"
      [attr.aria-label]="
        'culo.card'
          | translate
            : {
                value: (clave() + '.rank.' + rango(c.card) | translate),
                suit: (clave() + '.suit.' + palo(c.card) | translate)
              }
      "
    >
      <app-playing-card
        [card]="c.card"
        [deck]="baraja()"
        [size]="tamano()"
        [ancho]="anchoCarta()"
        [order]="$index"
      />
    </button>
  }
</div>

@if (vistaPrevia(); as codigo) {
  <!-- Toque mantenido: la carta, grande y en el centro, hasta que se toca en cualquier sitio. -->
  <div class="vista" (click)="cerrarVista()" role="presentation">
    <div class="vista__caja">
      <app-playing-card [card]="codigo" [deck]="baraja()" size="xl" />
      <p class="vista__nombre">
        {{
          'culo.card'
            | translate
              : {
                  value: (clave() + '.rank.' + rango(codigo) | translate),
                  suit: (clave() + '.suit.' + palo(codigo) | translate)
                }
        }}
      </p>
    </div>
  </div>
}
