<span class="pc"
      [style.width.px]="ancho()"
      [style.height.px]="ancho() ? ancho()! * 1.327 : null"
      [class]="'pc--' + size() + ' pc--' + state() + ' pc--baraja-' + deck()
        + (faceDown() || !esValida() ? ' pc--dorso' : '')"
      [style.--pc-orden]="order()"
      (pointermove)="alMover($event)"
      (pointerdown)="alPulsar($event)"
      (pointerup)="alSalir()"
      (pointercancel)="alSalir()"
      (pointerleave)="alSalir()"
      role="img"
      [attr.aria-label]="faceDown() || !esValida()
        ? ('poker.card.hidden' | translate)
        : (('card.rank.' + rango() | translate) + ' ' + ('card.suit.' + palo() | translate))">
  <img class="pc__cara" [src]="src()" alt="" draggable="false" />
</span>
